<!-- SIDEBAR - Componente compartido -->
<aside :class="$store.layout.sidebarOpen ? 'w-[270px]' : 'w-[68px]'" class="bg-bg-sidebar fixed top-[72px] left-0 bottom-0 z-30 transition-all duration-300 ease-out flex flex-col border-r border-[rgba(212,175,55,0.1)]" @mouseenter="$store.layout.abrirSidebar()" @mouseleave="$store.layout.cerrarSidebar()" @pointerdown="$store.layout.tocarSidebar($event)">
  <div class="px-4 py-5 flex items-center gap-3 overflow-hidden">
    <span class="text-2xl flex-shrink-0">🍽️</span>
    <span class="text-gold font-bold text-lg whitespace-nowrap overflow-hidden transition-all duration-300" :class="$store.layout.sidebarOpen ? 'opacity-100 max-w-[140px]' : 'opacity-0 max-w-0'">San Benito</span>
  </div>
  <nav class="flex-1 overflow-y-auto px-2 space-y-0.5">
    <template x-for="row in (typeof getOrderedNavRows === 'function' ? getOrderedNavRows($store.layout.menuGestion) : [])" :key="row.id">
      <div>
        <p x-show="row.type==='header'"
          class="sidebar-nav-section px-3 text-[10px] uppercase tracking-wider font-semibold overflow-hidden whitespace-nowrap transition-opacity duration-300 h-6 flex items-end"
          :class="$store.layout.sidebarOpen ? 'opacity-100' : 'opacity-0'"
          :style="row.color ? { color: row.color } : {}"
          x-text="row.label"></p>
        <a x-show="row.type==='item'" :href="row.href" :class="$store.layout.activeNav === row.key && 'active'" :data-nav="row.key"
          class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm relative"
          :style="estiloFilaSidebar(row)">
          <span :class="$store.layout.activeNav === row.key ? 'text-gold' : 'opacity-80'" class="text-[21.6px] leading-none flex-shrink-0 w-8 text-center" :style="($store.layout.activeNav !== row.key && row.color) ? { color: row.color } : {}" x-text="row.icon"></span>
          <span class="whitespace-nowrap overflow-hidden transition-all duration-300"
            :class="($store.layout.sidebarOpen ? 'opacity-100 max-w-[180px] ' : 'opacity-0 max-w-0 ') + ($store.layout.activeNav === row.key ? 'text-gold font-medium' : 'text-txt-secondary')"
            x-text="row.label"></span>
        </a>
      </div>
    </template>
  </nav>
  <div class="px-4 py-4 border-t border-[rgba(212,175,55,0.1)] flex items-center gap-3 overflow-hidden">
    <div class="w-9 h-9 rounded-full bg-gold flex-shrink-0 flex items-center justify-center text-bg-primary font-bold text-sm">A</div>
    <div class="min-w-0 overflow-hidden transition-all duration-300" :class="$store.layout.sidebarOpen ? 'opacity-100 max-w-[160px]' : 'opacity-0 max-w-0'">
      <p class="text-sm font-medium truncate">Admin</p>
      <p class="text-[11px] text-txt-muted truncate">Gerente</p>
    </div>
  </div>
</aside>
